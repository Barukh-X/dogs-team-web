<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>Dog's Team</title>
</head>

<body>
  <div class="Login">
  <h1>Login</h1>
  <form id="Logar" action="index.php" method="POST" accept-charset="utf-8">
    <div class="input_box">
      <input type="text" name="user" id="user" placeholder="Usuario" aria-label="Usuário" required>
      <img src="imagens/user.png" class="user-png" alt="">
    </div>
    <div class="input_box">
      <input type="password" name="password" id="password" placeholder="Senha" aria-label="Senha" required/>
      <img src="imagens/pass.png" class="pass-png" alt="">
    </div>

    <div class="Forgot_password">
      <a href="recuperar-senha.html">Esqueceu a Senha?</a>
    </div>

    <button type="submit" class="btn">Login</button>

    <div class="Register">
      <p>Não tem uma conta? <a href="cadastro.html">Cadastro</a></p>
    </div>
  </form>
</div>
  <script src="script.js"></script>
</body>
</html>
